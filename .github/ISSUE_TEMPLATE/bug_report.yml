name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command you ran, and the request body if it's an API problem.
      render: shell
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npx maclaya doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `maclaya serve --verbose` around the failure, if relevant.
      render: text
